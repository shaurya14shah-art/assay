id: SC-W-010
name: LSASS dump via comsvcs MiniDump by name
technique: T1003.001
tactic: credential_access
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\rundll32.exe'
    CommandLine: 'rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 624 C:\Windows\Temp\l.dmp full'
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'NT AUTHORITY\SYSTEM'
---
id: SC-W-011
name: LSASS dump via procdump
technique: T1003.001
tactic: credential_access
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Tools\procdump64.exe'
    CommandLine: 'procdump64.exe -accepteula -ma lsass.exe C:\Windows\Temp\l.dmp'
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'CORP\admin2'
---
id: SC-W-012
name: LSASS dump via comsvcs ordinal #24
technique: T1003.001
tactic: credential_access
note: Calls the MiniDump export by ordinal, so the literal string MiniDump never appears.
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\rundll32.exe'
    CommandLine: 'rundll32.exe C:\Windows\System32\comsvcs.dll #24 624 C:\Windows\Temp\l.dmp full'
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'NT AUTHORITY\SYSTEM'
---
id: SC-W-013
name: Shadow copies deleted with vssadmin
technique: T1490
tactic: impact
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\vssadmin.exe'
    CommandLine: 'vssadmin.exe delete shadows /all /quiet'
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'CORP\admin2'
---
id: SC-W-014
name: Recovery disabled with bcdedit
technique: T1490
tactic: impact
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\bcdedit.exe'
    CommandLine: 'bcdedit.exe /set {default} recoveryenabled no'
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'CORP\admin2'
