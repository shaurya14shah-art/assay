id: SC-W-001
name: Encoded PowerShell launched from a script host
technique: T1059.001
tactic: execution
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    CommandLine: 'powershell.exe -NoProfile -WindowStyle Hidden -EncodedCommand JABjAGwAaQBlAG4AdAAgAD0AIABOAGUAdwAtAE8AYgBqAGUAYwB0AA=='
    ParentImage: 'C:\Windows\System32\wscript.exe'
    User: 'CORP\jsmith'
---
id: SC-W-002
name: PowerShell with abbreviated -e encoded argument
technique: T1059.001
tactic: execution
note: Uses the short `-e` form. Rules matching only -enc / -encodedcommand / -ec will miss it.
logsource: { category: process_creation, product: windows }
events:
  - Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    CommandLine: 'powershell.exe -nop -w hidden -e SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAKQA='
    ParentImage: 'C:\Windows\System32\cmd.exe'
    User: 'CORP\jsmith'
---
