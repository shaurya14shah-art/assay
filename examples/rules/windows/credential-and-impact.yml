title: LSASS Dump via comsvcs MiniDump
id: assay-0010
status: stable
description: rundll32 invoking MiniDump from comsvcs.dll, used to dump LSASS memory.
tags: [attack.credential_access, attack.t1003.001]
level: critical
logsource: { category: process_creation, product: windows }
detection:
  sel:
    CommandLine|contains|all: ['comsvcs', 'MiniDump']
  condition: sel
---
title: Procdump Targeting LSASS
id: assay-0011
status: stable
description: Sysinternals procdump pointed at the lsass process.
tags: [attack.credential_access, attack.t1003.001]
level: critical
logsource: { category: process_creation, product: windows }
detection:
  tool:
    Image|endswith: ['\procdump.exe', '\procdump64.exe']
  target:
    CommandLine|contains: 'lsass'
  condition: tool and target
---
title: Shadow Copy Deletion
id: assay-0012
status: stable
description: Volume shadow copies deleted or recovery disabled, a ransomware precursor.
tags: [attack.impact, attack.t1490]
level: critical
logsource: { category: process_creation, product: windows }
detection:
  vss:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all: ['delete', 'shadows']
  wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all: ['shadowcopy', 'delete']
  bcd:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains: 'recoveryenabled no'
  condition: 1 of vss or wmic or bcd
---
title: Domain Account Discovery
id: assay-0013
status: test
description: net.exe used to enumerate domain users or privileged groups.
tags: [attack.discovery, attack.t1087.002]
level: medium
logsource: { category: process_creation, product: windows }
detection:
  net:
    Image|endswith: ['\net.exe', '\net1.exe']
  users:
    CommandLine|contains: ['user /domain', 'group /domain', 'group "domain admins"', 'localgroup administrators']
  condition: net and users
---
title: Repeated Failed Logons From One Source
id: assay-0014
status: experimental
description: Brute force heuristic. Needs aggregation, which Assay does not evaluate yet.
tags: [attack.credential_access, attack.t1110]
level: medium
logsource: { product: windows, service: security }
detection:
  sel:
    EventID: 4625
  condition: sel | count() by IpAddress > 10
